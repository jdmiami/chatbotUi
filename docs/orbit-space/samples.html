<title>Orbit Space Samples</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed 3D stage. An ink masthead band on top, an ink caption band at the bottom.
   Paper pages are real HTML placed in 3D; threads, dust and floor are drawn on a canvas behind them. */
:root{
  --ink:#0e0d0b;
  --band:#0e0d0b;
  --cream:#f3eee6;
  --stone:#8f877b;
  --soft:#c9c1b4;
  --orb:#6c7cff;
  --hair:rgba(243,238,230,.14);
  --hair2:rgba(243,238,230,.36);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{position:relative;height:100%;overflow:hidden}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline:none}
#stage.dragging{cursor:grabbing}
#stage.motion{cursor:default}
#bg{position:absolute;inset:0;z-index:0;pointer-events:none}
#world{position:absolute;inset:0;z-index:1}
.grain{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:var(--noise);background-size:180px 180px}

.t-ink{--void:#0e0d0b;background:radial-gradient(120% 80% at 50% 38%,#1b1814 0%,#0e0d0b 62%,#080706 100%)}
.t-ink .grain{opacity:.09;mix-blend-mode:overlay}
.t-cream{--void:#ece6db;background:linear-gradient(180deg,#f6f2ea 0%,#efe9df 46%,#e6dfd2 64%,#ddd5c6 100%)}
.t-cream .grain{opacity:.07;mix-blend-mode:multiply}
.t-folio{--void:#15110d;background:radial-gradient(110% 70% at 50% 30%,#2b231b 0%,#17130f 55%,#0c0a08 100%)}
.t-folio .grain{opacity:.1;mix-blend-mode:overlay}

/* ---------- nodes (paper in space) ---------- */
.node{position:absolute;left:50%;top:var(--cy,50%);transform-origin:50% 50%;backface-visibility:visible}
.node.sp{transform-style:preserve-3d}
.pg{position:relative;box-sizing:border-box;width:100%;height:100%;padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px;
  font-family:var(--serif);color:var(--text);background:var(--paperfill);border:1px solid var(--rule2);outline:1px solid var(--rule);outline-offset:-7px;box-shadow:var(--drop);overflow:hidden}
.pg::after{content:"";position:absolute;inset:-2px;background:var(--void);opacity:var(--fog,0);pointer-events:none}
.pg .k{margin:0;display:flex;justify-content:space-between;gap:8px;font:600 9px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:7px}
.pg .t{margin:0;font-size:25px;line-height:1.04;letter-spacing:-.02em;font-weight:360;text-wrap:balance}
.pg .d{margin:0;font-size:14px;line-height:1.42;color:var(--soft2)}
.pg .q{margin:0;font-style:italic;font-weight:300;font-size:33px;line-height:1.02;letter-spacing:-.025em}
.pg .ft{margin:auto 0 0;display:flex;align-items:center;gap:8px;font:500 11px/1.2 var(--sans);letter-spacing:.02em;color:var(--text);border-top:1px solid var(--rule);padding-top:8px}
.pg .dc::first-letter{float:left;font-size:50px;line-height:.82;padding:5px 7px 0 0;font-style:italic;color:var(--text)}
.pg .dot{width:7px;height:7px;border-radius:50%;background:var(--orb);box-shadow:0 0 10px var(--orb)}
.pg.sel{border:3px double var(--rule2);outline-offset:-9px}
.pg.sel .k span:last-child{color:var(--text)}
.pg.mini{padding:14px 15px 12px;gap:7px}
.pg.mini .t{font-size:20px}
.pg.slip{padding:16px 16px 12px;border-top:2px dashed var(--rule2);border-bottom:2px dashed var(--rule2);gap:6px}
.pg .ln{margin:0;display:flex;gap:10px;font:400 11px/1.55 var(--mono);color:var(--text)}
.pg .ln b{font-weight:400;color:var(--muted)}
.pg .cap2{margin:0;font:400 11px/1.3 var(--mono);color:var(--muted)}
.pg.stack{box-shadow:7px -7px 0 -1px var(--paper2),7px -7px 0 0 var(--rule2),14px -14px 0 -1px var(--paper3),14px -14px 0 0 var(--rule),var(--drop)}

.plate{position:relative;flex:1;min-height:0;border:1px solid var(--rule2);overflow:hidden;
  background:linear-gradient(180deg,#f4cfa6 0%,#eeb092 26%,#a99aab 50%,#4b5a74 53%,#2a374d 100%)}
.plate.night{background:linear-gradient(180deg,#1d2438 0%,#2c3550 40%,#40465e 52%,#151b2a 53%,#0c111c 100%)}
.plate i{position:absolute;display:block}
.plate .sea{left:0;right:0;bottom:0;height:47%;background:repeating-linear-gradient(180deg,transparent 0 7px,rgba(255,255,255,.13) 7px 8px)}
.plate .rock{left:54%;bottom:44%;width:46px;height:9px;background:#1d1a16}
.plate .tower{left:63%;bottom:46%;width:8px;height:52px;background:#1d1a16}
.plate .lamp{left:calc(63% - 3px);bottom:calc(46% + 52px);width:14px;height:6px;background:#ffd58a;box-shadow:0 0 14px 4px rgba(255,200,120,.75)}
.plate.night .lamp{box-shadow:0 0 22px 8px rgba(255,200,120,.85)}

/* spread that folds (motion 1) */
.spread{position:absolute;inset:0;transform-style:preserve-3d}
.half{position:absolute;top:0;width:50%;height:100%}
.half.left{left:0}
.half.right{left:50%;transform-origin:0 50%;transform-style:preserve-3d;transform:rotateY(var(--fold,0deg))}
.half.right .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.half.right .back{transform:rotateY(180deg)}
.half.right .front::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);opacity:var(--shade,0);pointer-events:none;z-index:1}
.pg .rv{transition:none}

/* typographic sculpture */
.num{font:italic 300 440px/.8 var(--serif);letter-spacing:-.06em;white-space:nowrap;color:var(--numfill);-webkit-text-stroke:1.2px var(--numstroke);display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.say{margin:0;white-space:nowrap;text-align:center;font:italic 300 30px/1.1 var(--serif);color:var(--onvoid);letter-spacing:-.01em}
.say.big{font-size:46px}

/* theme paper */
.t-ink{--paperfill:linear-gradient(165deg,#1d1a16 0%,#151310 100%);--paper2:#191613;--paper3:#141210;--text:#f3eee6;--muted:#8f877b;--soft2:#c9c1b4;--rule:rgba(243,238,230,.13);--rule2:rgba(243,238,230,.36);--drop:0 40px 80px -24px rgba(0,0,0,.75);--onvoid:#f3eee6;--numfill:rgba(243,238,230,.03);--numstroke:rgba(243,238,230,.22)}
.t-cream{--paperfill:linear-gradient(165deg,#fefcf8 0%,#f4eee4 100%);--paper2:#f6f1e8;--paper3:#efe8dc;--text:#1d1a16;--muted:#8a8073;--soft2:#4a443c;--rule:rgba(29,26,22,.12);--rule2:rgba(29,26,22,.34);--drop:0 1px 0 rgba(0,0,0,.04),0 26px 40px -30px rgba(70,50,30,.45);--onvoid:#1d1a16;--numfill:rgba(29,26,22,.03);--numstroke:rgba(29,26,22,.2)}
.t-folio{--paperfill:linear-gradient(165deg,#f7f2e9 0%,#e8dfd0 100%);--paper2:#ece4d6;--paper3:#e2d8c7;--text:#1d1a16;--muted:#857a6b;--soft2:#47403a;--rule:rgba(29,26,22,.13);--rule2:rgba(29,26,22,.36);--drop:0 50px 90px -26px rgba(0,0,0,.8);--onvoid:#efe4d2;--numfill:rgba(232,214,186,.035);--numstroke:rgba(232,214,186,.3)}

/* orb */
.orb{pointer-events:none}
.orb .core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#cdd2ff 16%,#6c7cff 46%,#252a77 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 0 36px 6px rgba(108,124,255,.5),0 0 120px 24px rgba(108,124,255,.22)}
.orb .ring{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(150,160,255,.55);transform:scale(calc(1 + var(--ring,0) * .55));opacity:calc(.12 + var(--ring,0) * .65)}
.orb .r2{inset:-30px;border-color:rgba(150,160,255,.28);transform:scale(calc(1 + var(--ring,0) * .32))}
.orb .compass{position:absolute;inset:-22px;border-radius:50%;border:1px dashed rgba(243,238,230,.6);opacity:var(--think,0);transform:rotate(var(--rot,0deg)) scale(calc(1.3 - var(--think,0) * .3))}
.t-cream .orb .compass{border-color:rgba(29,26,22,.55)}

/* ---------- masthead ---------- */
.mast{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--band);border-bottom:3px double var(--hair2);
  padding-block:10px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:9px}
.mast-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kick{margin:0;font:600 10px/1.2 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--stone)}
.folio{margin:0;font:italic 400 12px/1.2 var(--serif);color:var(--stone);white-space:nowrap}
.tabs{display:flex;align-items:stretch;gap:6px;flex-wrap:nowrap}
.grp{align-self:center;font:600 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--stone);margin-right:2px}
.sep{width:1px;background:var(--hair2);margin:4px 6px}
.tab{appearance:none;border:1px solid var(--hair);background:transparent;color:var(--soft);min-width:52px;min-height:44px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:0;font:inherit}
.tab b{font:italic 400 19px/1 var(--serif);color:var(--cream)}
.tab span{font:600 8.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}
.tab:hover{border-color:var(--hair2)}
.tab[aria-selected="true"]{border:3px double var(--hair2);background:#191613}
.tab[aria-selected="true"] span{color:var(--soft)}
.tab:focus-visible,.btn:focus-visible,#stage:focus-visible{outline:1px solid var(--cream);outline-offset:2px}

/* ---------- caption band ---------- */
.cap{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--band);border-top:3px double var(--hair2);
  padding-block:12px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.cap-inner{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-width:1100px}
.cap-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cap h1{margin:0;font:italic 300 30px/1 var(--serif);letter-spacing:-.025em;text-wrap:balance}
.dek{margin:0;max-width:68ch;font:400 14.5px/1.45 var(--serif);color:var(--soft)}
.phases{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 14px;font:500 11px/1.4 var(--sans);color:var(--stone)}
.phases li{display:flex;gap:6px;align-items:baseline}
.phases li em{font:italic 400 11px var(--serif);color:var(--stone)}
.phases li.on{color:var(--cream)}
.phases li.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orb);box-shadow:0 0 8px var(--orb);align-self:center}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.btn{appearance:none;border:1px solid var(--hair2);background:transparent;color:var(--cream);min-height:40px;padding:0 14px;font:500 13px/1 var(--sans);letter-spacing:.02em;cursor:pointer;border-radius:0}
.btn.primary{background:var(--cream);color:var(--ink);border-color:var(--cream);outline:1px solid rgba(14,13,11,.45);outline-offset:-4px}
.link{appearance:none;border:0;background:none;color:var(--stone);font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:6px 0;border-bottom:1px solid var(--hair2)}
.hint{margin:0;font:italic 400 12.5px/1.35 var(--serif);color:var(--stone);min-width:0}
.prog{height:1px;background:var(--hair);position:relative}
.prog i{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--cream)}

@media (max-width:520px){
  .grp{display:none}
  .folio{display:none}
  .tab{min-width:48px;padding:5px 6px}
  .cap h1{font-size:24px}
  .dek{font-size:13px;line-height:1.38}
  .phases{font-size:10.5px;gap:2px 10px}
  .cap{padding-block:10px 10px;gap:7px}
  .btn{min-height:38px}
}
@media (min-width:900px){
  .cap-inner{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:36px;align-items:start}
  .cap h1{font-size:36px}
}
</style>

<div class="app">
  <div id="stage" class="t-ink" tabindex="0" aria-label="3D sample. Drag to look around, use arrow keys to turn, plus and minus to move closer.">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="world"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>

  <header class="mast">
    <div class="mast-row">
      <p class="kick">Orbit · Space · samples for review</p>
      <p class="folio">Everything is a page. The orb lives in the space between.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Samples">
      <span class="grp">Looks</span>
      <button class="tab" role="tab" id="tab-look-a" data-s="look-a" aria-selected="true"><b>A</b><span>Ink</span></button>
      <button class="tab" role="tab" id="tab-look-b" data-s="look-b" aria-selected="false"><b>B</b><span>Paper</span></button>
      <button class="tab" role="tab" id="tab-look-c" data-s="look-c" aria-selected="false"><b>C</b><span>Folio</span></button>
      <span class="sep" aria-hidden="true"></span>
      <span class="grp">Motion</span>
      <button class="tab" role="tab" id="tab-motion-1" data-s="motion-1" aria-selected="false"><b>1</b><span>Approach</span></button>
      <button class="tab" role="tab" id="tab-motion-2" data-s="motion-2" aria-selected="false"><b>2</b><span>Forks</span></button>
      <button class="tab" role="tab" id="tab-motion-3" data-s="motion-3" aria-selected="false"><b>3</b><span>Nodes</span></button>
    </div>
  </header>

  <section class="cap" id="cap" aria-live="polite">
    <div class="cap-inner">
      <div>
        <div class="cap-head">
          <p class="kick" id="capKick">Look A · night</p>
          <button class="link" id="notes" aria-expanded="true" aria-controls="capBody">Hide notes</button>
        </div>
        <h1 id="capTitle">Ink Constellation</h1>
      </div>
      <div id="capBody" style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <p class="dek" id="capDek"></p>
        <ol class="phases" id="phases"></ol>
      </div>
    </div>
    <div class="ctrl">
      <button class="btn primary" id="replay" hidden>Replay</button>
      <button class="btn" id="pause" hidden>Pause</button>
      <button class="btn" id="back" hidden>Back to overview</button>
      <p class="hint" id="hint"></p>
    </div>
    <div class="prog" id="progWrap" hidden><i id="bar"></i></div>
  </section>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), world = $('#world'), cv = $('#bg'), ctx = cv.getContext('2d');
const mast = $('.mast'), cap = $('#cap');
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = mq.matches;

/* ---------- math ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, s, d) => clamp((t - s) / d, 0, 1);
const settle = p => 1 - Math.pow(1 - p, 5);              // close to cubic-bezier(.22,1,.36,1)
const inout = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(8 * p); // ~8% overshoot
const bump = p => Math.sin(Math.PI * clamp(p, 0, 1));
const V = (x, y, z) => ({ x, y, z });
const vlerp = (a, b, p) => V(lerp(a.x, b.x, p), lerp(a.y, b.y, p), lerp(a.z, b.z, p));
const vadd = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z);
const vdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const rotY = (v, a) => V(v.x * Math.cos(a) + v.z * Math.sin(a), v.y, -v.x * Math.sin(a) + v.z * Math.cos(a));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- viewport ---------- */
let W = 0, H = 0, P = 800, DPR = 1, CX = 0, CY = 0, VIS = 600, AX = 1, AY = 1, RM = 1;
const S = (x, y, z) => V(x * AX, y * AY, z);

/* ---------- camera ---------- */
const cam = { pos: V(0, 0, 1200), look: V(0, 0, 0), a: 0, b: 0, ca: 1, sa: 0, cb: 1, sb: 0, fd: 1200 };
function camBasis() {
  const tx = cam.look.x - cam.pos.x, ty = cam.look.y - cam.pos.y, tz = cam.look.z - cam.pos.z;
  const h = Math.hypot(tx, tz) || 1e-6;
  cam.b = Math.atan2(tx, -tz); cam.a = Math.atan2(-ty, h);
  cam.ca = Math.cos(cam.a); cam.sa = Math.sin(cam.a); cam.cb = Math.cos(cam.b); cam.sb = Math.sin(cam.b);
  cam.fd = Math.hypot(tx, ty, tz);
}
function toCam(p) {
  const x = p.x - cam.pos.x, y = p.y - cam.pos.y, z = p.z - cam.pos.z;
  const x1 = x * cam.cb + z * cam.sb, z1 = -x * cam.sb + z * cam.cb;
  return [x1, y * cam.ca - z1 * cam.sa, y * cam.sa + z1 * cam.ca];
}
function proj(v) { const d = -v[2], s = P / d; return { x: CX + v[0] * s, y: CY + v[1] * s, s, d }; }
function camForward() { const d = cam.fd || 1; return V((cam.look.x - cam.pos.x) / d, (cam.look.y - cam.pos.y) / d, (cam.look.z - cam.pos.z) / d); }
const readDist = (w, h) => P * Math.max(h / (0.66 * VIS), w / (0.86 * W));

/* ---------- scene graph ---------- */
let nodes = [], byId = {}, threads = [], dust = [], floorOn = false, FLOOR = 300, theme = null, orb = null, trail = [];
const THEMES = {
  ink:   { cls: 't-ink',   fog: .8,  thread: '243,238,230', ta: .34, dust: 230, dustRGB: '243,238,230', shadow: null },
  cream: { cls: 't-cream', fog: .74, thread: '29,26,22',    ta: .5,  dust: 0,   dustRGB: '29,26,22', shadow: '70,52,34' },
  folio: { cls: 't-folio', fog: .84, thread: '232,214,186', ta: .42, dust: 150, dustRGB: '240,214,170', shadow: null }
};

function clearScene() { world.innerHTML = ''; nodes = []; byId = {}; threads = []; dust = []; trail = []; orb = null; floorOn = false; }
function addNode(id, html, o) {
  const el = document.createElement('div');
  el.className = 'node' + (o.cls ? ' ' + o.cls : '');
  el.dataset.id = id;
  el.style.width = o.w + 'px'; el.style.height = o.h + 'px';
  el.style.marginLeft = (-o.w / 2) + 'px'; el.style.marginTop = (-o.h / 2) + 'px';
  el.innerHTML = html;
  world.appendChild(el);
  const n = { id, el, w: o.w, h: o.h, x: o.x || 0, y: o.y || 0, z: o.z || 0, yaw: o.yaw || 0, tilt: o.tilt || 0, s: 1, a: o.a == null ? 1 : o.a,
    bill: !!o.bill, shadow: !!o.shadow, tap: o.tap !== false, fog: o.fog !== false, vis: true };
  nodes.push(n); byId[id] = n; return n;
}
function setPos(n, p) { n.x = p.x; n.y = p.y; n.z = p.z; }
function thread(a, b, o = {}) { threads.push(Object.assign({ a, b, dash: false, prog: 1, alpha: 1, sag: .05, base: false }, o)); }
function makeDust(n, seed) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) dust.push({ p: V(r() * 7000 - 3500, r() * 4000 - 2000, r() * 8000 - 6500), ph: r() * 6.28, sp: .4 + r() * .8 });
}
function makeOrb(p) {
  orb = addNode('orb', '<span class="ring r2"></span><span class="ring"></span><span class="compass"></span><span class="core"></span>', { w: 60, h: 60, bill: true, tap: false, fog: false, cls: 'orb' });
  setPos(orb, p); orb.ring = .1; orb.think = 0; orb.rot = 0; return orb;
}

/* ---------- page templates ---------- */
const words = s => s.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
const PLATE = (night) => `<div class="plate${night ? ' night' : ''}"><i class="sea"></i><i class="rock"></i><i class="tower"></i><i class="lamp"></i></div>`;

function orbSpot(n) {
  if (Math.abs(n.tilt) > 1) return V(n.x - n.w * .3, n.y - 80, n.z);
  return vadd(n, rotY(V(-n.w / 2 - 6, -n.h / 2 - 6, 36), n.yaw));
}
let OT = null; // orb travel
function orbTo(p, now, dur = 720, arc = 140) { OT = { from: V(orb.x, orb.y, orb.z), to: p, t0: now, dur, arc }; }

function corePages(L) {
  const mk = (id, html, w, h, k) => {
    const [p, yaw, shadow, tilt] = k;
    return addNode(id, html, { w, h, x: p.x, y: p.y, z: p.z, yaw, tilt: tilt || 0, shadow: !!shadow });
  };
  mk('said', T.said(), 290, 196, L.said);
  mk('reply', T.reply(), 300, 350, L.reply);
  FORKS.forEach((f, i) => mk('f' + (i + 1), T.fork(f[0], f[1], f[2], f[3], i === 0), 240, 300, L['f' + (i + 1)]));
  mk('file', T.file(), 220, 280, L.file);
  mk('log', T.log(LOG4), 210, 290, L.log);
  mk('room', T.room('Short film', '12 pages'), 290, 200, L.room);
}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (SCENES[h] && h !== sceneId) show(h, false); });

/* grain texture for the paper feel */
(() => {
  const n = document.createElement('canvas'); n.width = n.height = 180;
  const x = n.getContext('2d'), img = x.createImageData(180, 180), r = rng(99);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + r() * 145; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  x.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${n.toDataURL()})`);
})();

show(SCENES[location.hash.slice(1)] ? location.hash.slice(1) : 'look-a', false);
requestAnimationFrame(frame);
})();
</script>
