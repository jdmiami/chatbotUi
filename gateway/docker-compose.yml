# Runs on your home network (e.g. on the Windows PC itself with Docker Desktop,
# or on any always-on machine on the same LAN such as a NAS or Raspberry Pi).
#
#   docker compose up -d                      # gateway + guacd only (LAN / port-forward)
#   docker compose --profile tunnel up -d     # + Cloudflare Tunnel (recommended, no open ports)

services:
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    # Not published: only the gateway talks to guacd.

  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Lets RDP_HOST=host.docker.internal reach the PC running Docker (Linux hosts need this line).
      - "host.docker.internal:host-gateway"
    depends_on:
      - guacd

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway
