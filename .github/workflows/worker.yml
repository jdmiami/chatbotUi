# Builds the serverless AI machine's container (ai/serverless/Dockerfile) whenever its code changes on
# main, and publishes it as ghcr.io/jdmiami/orbit-ai-worker:<commit> (and :main). The site points
# the Runpod endpoint at the image of the commit it runs (lib/serverlessMake.ts).
name: Serverless AI machine image
on:
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'shared/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: worker-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The runner's disk is small (about 14 GB free); PyTorch and ComfyUI's packages need more.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ai/serverless/Dockerfile
          push: true
          tags: |
            ghcr.io/jdmiami/orbit-ai-worker:${{ github.sha }}
            ghcr.io/jdmiami/orbit-ai-worker:main
          labels: |
            org.opencontainers.image.source=https://github.com/jdmiami/chatbotUi
            org.opencontainers.image.description=The serverless AI machine (image and video maker) for Orbit
          cache-from: type=registry,ref=ghcr.io/jdmiami/orbit-ai-worker:buildcache
          cache-to: type=registry,ref=ghcr.io/jdmiami/orbit-ai-worker:buildcache,mode=max
